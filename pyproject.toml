[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litert-agent"
version = "0.1.0"
description = "Fully local-first autonomous AI agent powered by LiteRT-LM CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "LiteRT Agent Project Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "playwright>=1.40.0",
    "textual>=0.40.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
litert-agent = "litert_agent.cli:app"
litert-agent-self = "litert_agent.self_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/litert_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
